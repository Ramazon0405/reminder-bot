name: reminder-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # wake every 5 minutes (GitHub's minimum interval)
  workflow_dispatch: {}     # allow manual "Run workflow" button for testing

# Never let two bot runs overlap — each one starts only after the previous
# ended (they chain back-to-back, keeping the bot effectively always awake).
concurrency:
  group: reminder-bot
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the state database back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TZ_NAME: Asia/Tashkent
      SUMMARY_TIME: "23:00"
      OCR_LANG: eng
      AWAKE_SECONDS: "240"  # bot lives 4 min per run, then exits cleanly
      OCR_DEBUG: "1"        # temporary: dump raw OCR spans into the run log
      DB_PATH: work/bot.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore encrypted database
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          if [ -f bot.db.enc ]; then
            mkdir -p work
            openssl enc -d -aes-256-cbc -pbkdf2 -in bot.db.enc -out work/bot.db -pass env:DATA_KEY
            echo "Restored existing database."
          else
            echo "First run - starting with a fresh database."
          fi

      - name: Run bot (awake window)
        run: python bot.py

      - name: Save encrypted database back to repo
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          if [ -z "$DATA_KEY" ]; then
            echo "::error::DATA_KEY secret is not set (or empty). Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ ! -f work/bot.db ]; then
            echo "::error::work/bot.db not found — the bot run did not leave a database behind."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -in work/bot.db -out bot.db.enc -pass env:DATA_KEY
          git config user.name  "reminder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot.db.enc
          git commit -m "chore: state update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit."
          git pull --rebase origin main || { echo "::error::git pull --rebase failed"; exit 1; }
          git push
